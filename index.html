<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tab-sync</title>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("tab-sync:settings");
        if (raw) {
          var data = JSON.parse(raw);
          if (data && data.theme && data.theme.value === "dark") {
            document.documentElement.dataset.theme = "dark";
          }
          if (data && data.fontSize && typeof data.fontSize.value === "number") {
            var fs = Math.min(20, Math.max(10, Math.round(data.fontSize.value)));
            document.documentElement.style.setProperty("--font-size", fs + "px");
          }
        }
      } catch (_) {}
    })();
  </script>
</head>

<body>
  <main class="card">
    <h1 id="title"></h1>

    <label class="row">
      <span id="label-theme"></span>
      <input type="checkbox" id="theme-toggle" role="switch" />
    </label>

    <label class="row">
      <span id="label-language"></span>
      <select id="language-select"></select>
    </label>

    <label class="row">
      <span id="label-font"></span>
      <input type="range" id="font-slider" />
      <span id="font-value"></span>
    </label>

    <p id="preview" class="preview"></p>

    <div id="sync-status" class="sync-status"></div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
